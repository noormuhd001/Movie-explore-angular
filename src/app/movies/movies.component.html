<!-- Hero Section -->
<header class="bg-danger text-center py-5">
  <div class="container">
    <h1 class="display-4 fw-bold">Discover Movies & Series</h1>
    <p class="lead mb-4">Search, explore, and save your favorite movies with ease.</p>
    <div class="input-group w-50 mx-auto">
      <input type="text" class="form-control" placeholder="🔍 Search for movies..." [(ngModel)]="searchQuery" />
      <button class="btn btn-dark" (click)="searchMovies()">Search</button>
    </div>
  </div>
</header>

<!-- Trending Movies -->
<main class="container flex-grow-1 py-5">
  <h2 class="mb-4 border-start border-4 border-danger ps-3">🔥 Trending Movies</h2>

  <div class="row g-4">
    <div class="col-6 col-md-4 col-lg-3 w-25" *ngFor="let movie of trendingMovies">
      <div class="card h-100 bg-dark text-light shadow-sm">
        <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" [alt]="movie.title" class="card-img-top" />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-truncate">{{ movie.title }}</h5>
          <p class="card-text mb-2">⭐ {{ movie.vote_average }}/10</p>
          <button class="btn btn-danger mt-auto" (click)="addToFavorites(movie)" [disabled]="movie.isFavorite">
            {{ movie.added ? "Added" : "+ Add to Favorites" }}
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<h1 class="text-center my-4">Register</h1>

<div class="container register-container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <form class="p-4 shadow rounded bg-light">
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name">
        </div>

        <!-- Mobile -->
        <div class="mb-3">
          <label for="mobile" class="form-label">Mobile</label>
          <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="Enter your mobile number">
        </div>

        <!-- Submit -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            Register
          </button>
          <br>
          <button routerLink="" class="btn btn-secondary">Back</button>
        </div>
      </form>
    </div>
  </div>
</div>

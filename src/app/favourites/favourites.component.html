<div class="container py-5">
  <h2 class="mb-4 border-start border-4 border-warning ps-3">⭐ Your Favorites</h2>

  <!-- If no favorites -->
  <div *ngIf="favorites.length === 0" class="text-center py-5">
    <p class="fs-5">No favorites added yet. Start adding movies from Home 🎬</p>
  </div>

  <!-- Favorites Grid -->
  <div class="row g-4" *ngIf="favorites.length > 0">
    <div class="col-6 col-md-4 col-lg-3" *ngFor="let movie of favorites">
      <div class="card h-100 bg-dark text-light shadow-sm">
        <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
             [alt]="movie.title"
             class="card-img-top" />

        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-truncate">{{ movie.title }}</h5>
          <p class="card-text mb-2">⭐ {{ movie.vote_average }}/10</p>
          <button class="btn btn-outline-danger mt-auto" (click)="removeFromFavorites(movie)">
            ❌ Remove
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
